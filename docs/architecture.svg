<svg viewBox="0 0 1000 1300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1000" height="1300" fill="#f8fafc"/>

  <text x="500" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Revenue Autopilot — Architecture</text>
  <text x="500" y="72" text-anchor="middle" font-size="14" fill="#64748b">Diagnose → Gate → Audit → Execute → Measure</text>

  <!-- Data sources -->
  <rect x="120" y="100" width="330" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="285" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">Synthetic Merchant Data</text>
  <text x="285" y="148" text-anchor="middle" font-size="12" fill="#0c4a6e">Customers, Orders, Checkout Events</text>

  <rect x="550" y="100" width="330" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="715" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">Conversational Checkout</text>
  <text x="715" y="148" text-anchor="middle" font-size="12" fill="#0c4a6e">Direction B: chat → catalog → real order</text>

  <line x1="285" y1="170" x2="285" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="170" x2="715" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="285" y1="215" x2="500" y2="215" stroke="#334155" stroke-width="2"/>
  <line x1="715" y1="215" x2="500" y2="215" stroke="#334155" stroke-width="2"/>
  <line x1="500" y1="215" x2="500" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Opportunity detection -->
  <rect x="300" y="245" width="400" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="500" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#713f12">Opportunity Detection (analytics.py)</text>

  <line x1="500" y1="305" x2="500" y2="340" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LangGraph box -->
  <rect x="180" y="345" width="640" height="620" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="500" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">LangGraph Agent</text>

  <!-- Diagnose -->
  <rect x="300" y="395" width="400" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="500" y="425" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1. Diagnose (LLM)</text>
  <text x="500" y="446" text-anchor="middle" font-size="11" fill="#1e3a8a">Grounded only in real evidence</text>
  <text x="500" y="462" text-anchor="middle" font-size="11" fill="#1e3a8a">Hard guardrail: action must be in approved list</text>

  <line x1="500" y1="475" x2="500" y2="505" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Policy Gate -->
  <rect x="300" y="510" width="400" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="540" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">2. Policy Gate (deterministic)</text>
  <text x="500" y="561" text-anchor="middle" font-size="11" fill="#7f1d1d">No LLM. Max discount %, approval threshold</text>
  <text x="500" y="577" text-anchor="middle" font-size="11" fill="#7f1d1d">Outcome: APPROVED / NEEDS_APPROVAL / BLOCKED</text>

  <line x1="500" y1="590" x2="500" y2="620" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Audit -->
  <rect x="300" y="625" width="400" height="65" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="500" y="652" text-anchor="middle" font-size="15" font-weight="bold" fill="#581c87">3. Audit Trail</text>
  <text x="500" y="672" text-anchor="middle" font-size="11" fill="#581c87">Every decision logged, even if blocked</text>

  <line x1="500" y1="690" x2="500" y2="710" stroke="#334155" stroke-width="2"/>
  <text x="560" y="705" font-size="11" fill="#334155" font-style="italic">conditional edge</text>
  <line x1="500" y1="710" x2="500" y2="730" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="722" font-size="11" fill="#15803d" font-weight="bold">only if APPROVED</text>

  <!-- Execute -->
  <rect x="300" y="735" width="400" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="765" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">4. Execute (Razorpay)</text>
  <text x="500" y="786" text-anchor="middle" font-size="11" fill="#14532d">Real test-mode API call</text>
  <text x="500" y="802" text-anchor="middle" font-size="11" fill="#14532d">Safe retry, no duplicate action on failure</text>

  <!-- Merchant approval branch -->
  <rect x="60" y="510" width="180" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="150" y="538" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Merchant</text>
  <text x="150" y="555" text-anchor="middle" font-size="11" fill="#7c2d12">Approves held</text>
  <text x="150" y="570" text-anchor="middle" font-size="11" fill="#7c2d12">actions via</text>
  <text x="150" y="585" text-anchor="middle" font-size="11" fill="#7c2d12">dashboard</text>
  <line x1="240" y1="550" x2="300" y2="550" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="510" x2="150" y2="470" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="150" y1="470" x2="290" y2="470" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="150" y="500" font-size="10" fill="#7c2d12">sees NEEDS_APPROVAL</text>

  <line x1="500" y1="815" x2="500" y2="850" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Measurement -->
  <rect x="220" y="855" width="560" height="90" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="500" y="885" text-anchor="middle" font-size="15" font-weight="bold" fill="#831843">5. Incremental Revenue Measurement</text>
  <text x="500" y="906" text-anchor="middle" font-size="11" fill="#831843">Control vs. Treatment comparison</text>
  <text x="500" y="922" text-anchor="middle" font-size="11" fill="#831843">Estimates revenue caused BY the agent, not just correlated</text>

  <line x1="500" y1="965" x2="500" y2="990" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Dashboard -->
  <rect x="300" y="995" width="400" height="65" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="500" y="1022" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Dashboard (FastAPI + HTML/JS)</text>
  <text x="500" y="1042" text-anchor="middle" font-size="11" fill="#312e81">Live stats, pending approvals, audit trail, payment links</text>

  <!-- Trust boundary legend -->
  <rect x="60" y="1090" width="880" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="1118" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Trust Boundary Summary</text>

  <text x="90" y="1148" font-size="12" fill="#1e3a8a" font-weight="bold">LLM:</text>
  <text x="150" y="1148" font-size="12" fill="#334155">Proposes only. No execution authority. Output validated against a fixed action list.</text>

  <text x="90" y="1174" font-size="12" fill="#7f1d1d" font-weight="bold">Policy Engine:</text>
  <text x="200" y="1174" font-size="12" fill="#334155">Absolute authority. Pure deterministic code, no LLM involved.</text>

  <text x="90" y="1200" font-size="12" fill="#581c87" font-weight="bold">Audit Trail:</text>
  <text x="185" y="1200" font-size="12" fill="#334155">Read-only, permanent record of every decision — approved, blocked, or held.</text>

  <text x="90" y="1226" font-size="12" fill="#14532d" font-weight="bold">Executor:</text>
  <text x="175" y="1226" font-size="12" fill="#334155">Only runs on APPROVED. Retries safely, never duplicates a money action.</text>

  <text x="90" y="1252" font-size="12" fill="#7c2d12" font-weight="bold">Merchant:</text>
  <text x="175" y="1252" font-size="12" fill="#334155">Final override authority on any action above the auto-approve threshold.</text>
</svg>
